name: CI

on:
  # Pas de filtre "paths" : les checks sont obligatoires sur main (ruleset),
  # ils doivent donc s'exécuter sur TOUTES les PR.
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.0"
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: Format (terraform fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive -diff

  validate:
    name: Validate (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - environments/dev
          # - bootstrap/state-backend   # à réactiver quand le state backend sera implémenté
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

  security:
    name: Security scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          soft_fail: false
          output_format: cli

  backend-tests:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Java 21, comme dans pom.xml. Le cache garde les dépendances Maven
      # entre deux exécutions pour aller plus vite.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # mvnw a été créé sous Windows : il peut lui manquer le droit
      # d'exécution sous Linux.
      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      # verify = compilation + tous les tests
      - name: Build and test
        run: ./mvnw -B verify
        
  tflint:
    name: Lint (TFLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: terraform-linters/setup-tflint@v4

      # Télécharge les plugins déclarés dans .tflint.hcl
      - name: tflint --init
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Mode observation pour le premier passage : on lit les résultats
      # sans bloquer la PR. On retirera continue-on-error après le tri.
      - name: tflint
        run: tflint --recursive --format compact
        continue-on-error: true